<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>烧饼修改器 1.2.0</title>
  <style>
    body { margin: 0; padding: 14px; background: #efeff4; color: #222; font: 15px/1.6 Helvetica, Arial, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 21px; }
    h2 { margin: 0 0 8px; font-size: 17px; }
    section { margin: 0 0 14px; padding: 14px; background: #fff; border: 1px solid #d7d7db; border-radius: 8px; }
    p { margin: 0 0 10px; }
    p:last-child { margin-bottom: 0; }
    ul { padding-left: 22px; margin: 0; }
  </style>
</head>
<body>
  <h1>烧饼修改器 1.2.0</h1>
  <section>
    <h2>功能介绍</h2>
    <p>烧饼修改器是一款通用游戏内存修改器，可以搜索、修改游戏中的血量、攻击力、金钱等数值。</p>
    <p>1.2.0 版采用全新架构，支持模糊搜索、联合搜索和搜索数据类型选择，并改进稳定性与兼容性。作者：烧饼哥。</p>
  </section>
  <section>
    <h2>兼容性与归档说明</h2>
    <ul>
      <li>原包声明支持已越狱的 iOS 5、iOS 6、iOS 7。</li>
      <li>应用要求 armv7；原包说明也声明支持 64 位设备。</li>
      <li>DEB 版本为 1.2.0，应用内部构建号为 1.2.1。</li>
      <li>此处保留历史安装包原始字节，尚未做真机安装或运行验证。</li>
    </ul>
  </section>
</body>
</html>
